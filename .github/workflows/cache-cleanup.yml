name: Cache Cleanup
on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: '15 7 * * *' # Every day at 7:15 AM
      timezone: Etc/UTC
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  cleanup:
    name: Cleanup
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Delete GitHub Actions caches
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          open_pull_request_refs="$(gh api 'repos/${{ github.repository }}/pulls?per_page=100&state=open' --jq='.[] | "refs/pull/\(.number)/merge"' --paginate)"
          cache_refs="$(gh api 'repos/${{ github.repository }}/actions/caches?per_page=100' --jq='.actions_caches[].ref | select(test("^refs/pull/[0-9]+/merge$"))' --paginate)"

          while IFS= read -r ref; do
              gh cache delete --all --ref="$ref" --repo=${{ github.repository }} --succeed-on-no-caches
          done < <(comm -13 <(printf '%s' "$open_pull_request_refs" | sort) <(printf '%s' "$cache_refs" | sort --unique))
        env:
          GITHUB_TOKEN: ${{ github.token }}
